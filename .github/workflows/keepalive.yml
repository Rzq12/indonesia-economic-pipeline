name: Keep Streamlit Warm

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" https://indonesia-economic-pipeline.streamlit.app/_stcore/health)
          echo "health status: $code"
          if [ "$code" != "200" ]; then exit 1; fi