version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: economic_db
      POSTGRES_USER: ${DB_USER:-pipeline}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d economic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pipeline:
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: economic_db
      DB_USER: ${DB_USER:-pipeline}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: python -m src.pipeline.flows

  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      PYTHONPATH: /app
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: economic_db
      DB_USER: ${DB_USER:-pipeline}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
    depends_on:
      - pipeline
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  pgdata:
